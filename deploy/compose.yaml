# atlasos.eterneon.net, in /srv/atlasos-site on eterneon-vps.
#
# Two services on a network of their own, atlasos_inside (172.29.0.0/24),
# that the matrix stack's Caddy also joins (see /srv/matrix/compose.yaml) and
# nothing else does. Both trust X-Real-IP, which only Caddy may set, so no
# other container may reach them. deploy.sh creates the network.
#
# .env (mode 600, made by deploy.sh on the first deploy) holds
# DOWNLOAD_SECRET, shared by both: the site signs download links with it and
# the download server checks them.
services:
  atlasos-site:
    image: atlasos/site:local
    restart: unless-stopped
    env_file: .env
    environment:
      DOWNLOADS_DIR: /data
    volumes:
      # The ISO folder CI uploads to; the site only reads <image>.json.
      - /srv/downloads/atlasos:/data:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3060/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [inside]

  # The ISOs, only by signed link, with per-address, total and speed limits.
  # Most bandwidth it can use: MAX_DOWNLOADS x DOWNLOAD_RATE (12 x 3 MB/s,
  # about 300 Mbit/s), leaving the rest of the uplink to everything else.
  atlasos-dl:
    image: nginx:1.30-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
      MAX_DOWNLOADS: "12"
      PER_IP_DOWNLOADS: "2"
      DOWNLOAD_RATE: 3m
      INSIDE_SUBNET: 172.29.0.0/24
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
      - /srv/downloads/atlasos:/srv/iso:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    networks: [inside]

networks:
  inside:
    external: true
    name: atlasos_inside
