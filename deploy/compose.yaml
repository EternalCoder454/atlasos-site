# atlasos.eterneon.net, in /srv/atlasos-site on eterneon-vps.
#
# Two services on the matrix stack's network, where Caddy reaches them by
# name. Their names are unique on that network on purpose: the Eterneon site
# is already "site" there.
#
# .env (mode 600, made by deploy.sh on the first deploy) holds
# DOWNLOAD_SECRET, shared by both: the site signs download links with it and
# the download server checks them.
services:
  atlasos-site:
    image: atlasos/site:local
    restart: unless-stopped
    env_file: .env
    environment:
      DOWNLOADS_DIR: /data
    volumes:
      # The ISO folder CI uploads to; the site only reads <image>.json.
      - /srv/downloads/atlasos:/data:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3060/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [edge]

  # The ISOs, only by signed link, with per-address, total and speed limits.
  # Most bandwidth it can use: MAX_DOWNLOADS x DOWNLOAD_RATE (8 x 4 MB/s,
  # about 270 Mbit/s), leaving the rest of the uplink to everything else.
  atlasos-dl:
    image: nginx:1.30-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
      MAX_DOWNLOADS: "8"
      PER_IP_DOWNLOADS: "2"
      DOWNLOAD_RATE: 4m
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
      - /srv/downloads/atlasos:/srv/iso:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    networks: [edge]

networks:
  edge:
    external: true
    name: matrix_inside
